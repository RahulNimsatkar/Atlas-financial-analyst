services:
  - type: web
    name: atlas-financial-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: RENDER_URL
        sync: false
      - key: DEFAULT_TIMEZONE
        value: Asia/Kolkata
      - key: CHAT_MODEL
        value: llama-3.1-8b-instant
      - key: RESEARCH_MODEL
        value: llama-3.3-70b-versatile
